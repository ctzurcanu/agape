<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Stop Agape emails</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="stylesheet" href="legal.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./">agape</a>
      <nav><a href="./">Open Agape</a><a href="privacy.html">Privacy</a></nav>
    </header>
    <main>
      <h1>Stop Agape emails</h1>
      <p id="status">
        You will stop receiving all Agape emails. Notices still appear when you visit Agape, and you
        can turn emails back on under Notices.
      </p>
      <p><button id="stop" type="button">Stop all Agape emails</button></p>
      <noscript>
        <p>This page needs JavaScript. You can also turn emails off in Agape under Notices.</p>
      </noscript>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get('token') || ''
      const status = document.getElementById('status')
      const button = document.getElementById('stop')
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)) {
        status.textContent =
          'This link is incomplete. You can turn email notices off in Agape under Notices.'
        button.hidden = true
      }
      button.addEventListener('click', async () => {
        button.disabled = true
        try {
          const response = await fetch(
            'https://yajenrxydqzljmbaoeyl.supabase.co/functions/v1/agape-unsubscribe?token=' +
              encodeURIComponent(token),
            { method: 'POST' },
          )
          if (response.ok) {
            status.textContent =
              'Done. You will no longer receive Agape emails. You can turn them back on under Notices.'
            button.hidden = true
          } else if (response.status === 404) {
            status.textContent =
              'This link is no longer valid. You can manage email notices in Agape under Notices.'
            button.hidden = true
          } else status.textContent = 'Something went wrong. Please try again later.'
        } catch {
          status.textContent = 'Something went wrong. Please try again later.'
        } finally {
          button.disabled = false
        }
      })
    </script>
  </body>
</html>
